roles:
  reviewer:
    description: "Senior code reviewer — finds bugs, security, correctness issues"
    prompt_file: prompts/reviewer.txt
  coder:
    description: "Expert developer — applies fixes or rejects with reasoning"
    prompt_file: prompts/coder.txt
  judge:
    description: "Final arbiter — evaluates all rounds, scores, verdict"
    prompt_file: prompts/judge.txt

models:
  claude-opus:
    provider: claude-cli
    model: opus
  claude-sonnet:
    provider: claude-cli
    model: sonnet
  codex:
    provider: codex-cli
  qwen-local:
    provider: openai-compat
    base_url: http://localhost:8000
    model: qwen3.5
    max_tokens: 8192
    temperature: 0.1
  deepseek:
    provider: openai-compat
    base_url: https://api.deepseek.com
    model: deepseek-coder
    api_key_env: DEEPSEEK_API_KEY

# Map roles to models (easily swappable)
assignments:
  reviewer: claude-opus
  coder: qwen-local
  judge: claude-opus

# Pipeline settings
pipeline:
  max_rounds: 4
  batch_max_lines: 6000
  severity_threshold: warning  # error|warning|suggestion
  auto_style_fix: true
  # Multi-pass review (P0)
  review_passes: 3           # number of review passes (1 = single pass)
  review_min_votes: 2         # minimum passes that must flag a finding for high confidence
  only_high_confidence: true  # only send high-confidence findings to coder
  # Static analysis pre-screening (P1)
  static_analysis: true        # run linters before LLM review
  # Layered review (P2) — mutually exclusive with multi-pass
  review_layers: []            # e.g. ["architecture", "interface", "logic", "security"]
  # Knowledge accumulation (P4)
  knowledge_accumulation: false # accumulate patterns across rounds
  # Smart grouping (P3) — requires: pip install -e '.[graph]'
  smart_grouping: false        # use tree-sitter dependency graph for file batching
