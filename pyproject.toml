[project]
name = "code-review-loop"
version = "0.1.0"
description = "Multi-agent, model-agnostic automated code review pipeline"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.0",
]

[project.scripts]
code-review = "code_review.cli:main"

[tool.setuptools.packages.find]
include = ["code_review*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
