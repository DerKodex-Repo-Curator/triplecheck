[project]
name = "triplecheck"
version = "0.1.0"
description = "Three AI agents review your code. Reviewer → Coder → Judge. Loop until clean."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.0",
]

[project.optional-dependencies]
graph = ["tree-sitter>=0.21", "tree-sitter-python>=0.21", "tree-sitter-go>=0.21", "networkx>=3.0"]

[project.scripts]
triplecheck = "triplecheck.cli:main"

[tool.setuptools.packages.find]
include = ["triplecheck*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
