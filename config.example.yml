roles:
  reviewer:
    description: "Senior code reviewer — finds bugs, security, correctness issues"
    prompt_file: prompts/reviewer.txt
  coder:
    description: "Expert developer — applies fixes or rejects with reasoning"
    prompt_file: prompts/coder.txt
  judge:
    description: "Final arbiter — evaluates all rounds, scores, verdict"
    prompt_file: prompts/judge.txt

models:
  claude-opus:
    provider: claude-cli
    model: opus
  claude-sonnet:
    provider: claude-cli
    model: sonnet
  codex:
    provider: codex-cli
  qwen-local:
    provider: openai-compat
    base_url: http://localhost:8000
    model: Qwen/Qwen3-Coder              # change to your model name
    max_tokens: 32768
    temperature: 0.1
    no_think: false
  deepseek:
    provider: openai-compat
    base_url: https://api.deepseek.com
    model: deepseek-coder
    api_key_env: DEEPSEEK_API_KEY

# Map roles to models (easily swappable)
assignments:
  reviewer: qwen-local
  coder: qwen-local
  judge: qwen-local

# Pipeline settings
pipeline:
  max_rounds: 4
  batch_max_lines: 800
  severity_threshold: warning  # error|warning|suggestion
  auto_style_fix: true
  # Multi-pass review
  review_passes: 1             # number of review passes (1 = single pass)
  review_min_votes: 1          # minimum passes that must flag a finding for high confidence
  only_high_confidence: false  # send all findings to coder
  # Static analysis pre-screening
  static_analysis: true        # run linters before LLM review
  # Layered review — mutually exclusive with multi-pass
  review_layers: []            # e.g. ["architecture", "interface", "logic", "security"]
  # Knowledge accumulation
  knowledge_accumulation: false # accumulate patterns across rounds
  # Smart grouping — requires: pip install triplecheck[graph]
  smart_grouping: true         # use tree-sitter dependency graph for file batching
  # Concurrent batch review — send N batches to LLM simultaneously
  concurrency: 1               # 1 = serial, 2-3 = parallel (only useful with cloud APIs or multi-GPU)
